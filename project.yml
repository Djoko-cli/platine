# Projet Xcode de Platine, généré par xcodegen (le .xcodeproj n'est pas versionné).
# Générer : xcodegen ; construire et installer sur l'iPhone : scripts/construire.sh
name: Platine
options:
  bundleIdPrefix: io.github.djoko-cli
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Platine:
    type: application
    platform: iOS
    sources:
      - Platine
      - Commun
    dependencies:
      - target: PlatineSession
    info:
      path: Platine/Info.plist
      properties:
        CFBundleDisplayName: Platine
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Le portier (portier/), comme l'extension : un seul chemin, à la maison comme dehors, sans réseau local.
        # Adresse et jeton réglés dans Config/Local.xcconfig (non versionné).
        PlatinePortier: $(PLATINE_PORTIER)
        PlatineJeton: $(PLATINE_JETON)
    entitlements:
      path: Platine/Platine.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.djoko-cli.platine
        # Les push nowplaying (démarrage et mise à jour de la carte) ; développement tant que l'app passe par Xcode.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.djoko-cli.platine
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PlatineSession:
    type: extensionkit-extension
    platform: iOS
    sources:
      - PlatineSession
      - Commun
    info:
      path: PlatineSession/Info.plist
      properties:
        CFBundleDisplayName: Platine
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.nowplaying.remote-media
        # Le portier (portier/) joint par le nom public de la maison : iOS refuse le réseau local à l'extension, mais
        # laisse passer une adresse publique, que la box renvoie au NAS. Adresse et jeton réglés dans
        # Config/Local.xcconfig (non versionné) ; le jeton finit dans le paquet de l'app, installée par Xcode.
        PlatinePortier: $(PLATINE_PORTIER)
        PlatineJeton: $(PLATINE_JETON)
        # Les paires stéréo, réunies en une seule ligne de la carte (identifiants des sorties d'OwnTone, locaux).
        PlatinePaires: $(PLATINE_PAIRES)
    entitlements:
      path: PlatineSession/PlatineSession.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.djoko-cli.platine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.djoko-cli.platine.session
