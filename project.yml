# Projet Xcode de Platine, généré par xcodegen (le .xcodeproj n'est pas versionné).
# Générer : xcodegen ; construire et installer sur l'iPhone : scripts/construire.sh
name: Platine
options:
  bundleIdPrefix: io.github.djoko-cli
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Platine:
    type: application
    platform: iOS
    sources:
      - Platine
      - Commun
    dependencies:
      - target: PlatineSession
    info:
      path: Platine/Info.plist
      properties:
        CFBundleDisplayName: Platine
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Platine lit ce que joue OwnTone sur le réseau de la maison et lui transmet tes commandes."
        NSBonjourServices:
          - _daap._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Adresse d'OwnTone par défaut, réglée dans Config/Local.xcconfig (non versionné).
        OwnToneURL: $(OWNTONE_URL)
    entitlements:
      path: Platine/Platine.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.djoko-cli.platine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.djoko-cli.platine
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PlatineSession:
    type: extensionkit-extension
    platform: iOS
    sources:
      - PlatineSession
      - Commun
    info:
      path: PlatineSession/Info.plist
      properties:
        CFBundleDisplayName: Platine
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.nowplaying.remote-media
        NSLocalNetworkUsageDescription: "Platine transmet tes commandes à OwnTone sur le réseau de la maison."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # OwnTone par son nom Tailscale, en HTTP dans le tunnel chiffré de Tailscale.
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        # Adresse d'OwnTone par Tailscale, réglée dans Config/Local.xcconfig (non versionné). Quand elle est réglée,
        # l'extension l'utilise pour les commandes, le volume et la pochette : iOS lui refuse le réseau local.
        PlatineSondeTailscale: $(OWNTONE_URL_TAILSCALE)
        # Adresse publique de la maison pour la sonde réseau (essai témoin), réglée dans Config/Local.xcconfig.
        PlatineSondePublique: $(PLATINE_SONDE_PUBLIQUE)
    entitlements:
      path: PlatineSession/PlatineSession.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.djoko-cli.platine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.djoko-cli.platine.session
